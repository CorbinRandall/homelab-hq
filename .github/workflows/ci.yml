name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go build -buildvcs=false -trimpath ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: homelab-hq:test
          load: true
      - name: Runtime smoke test
        run: |
          mkdir -p smoke-data
          docker run -d --name homelab-hq-smoke --network host \
            -v "$PWD/config.example.json:/config/config.json:ro" \
            -v "$PWD/smoke-data:/data" homelab-hq:test
          for attempt in 1 2 3 4 5; do
            curl --fail --silent http://127.0.0.1:8888/health && exit 0
            sleep 1
          done
          docker logs homelab-hq-smoke
          exit 1
